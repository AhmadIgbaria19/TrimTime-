name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, unit tests, client build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck the client
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build the client
        run: npm run build -w client

  live:
    name: Isolated Postgres live tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: trimtime
      PGPASSWORD: ci_only_not_production
      PGDATABASE: trimtime
      PGDATABASE_TEST: trimtime_test
      ADMIN_NAME: Salon Owner
      ADMIN_PHONE: "0500000001"
      ADMIN_PASSWORD: CiAdminPass12
      SESSION_SECRET: ci_session_secret_not_for_production
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: trimtime
          POSTGRES_PASSWORD: ci_only_not_production
          POSTGRES_DB: trimtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trimtime -d trimtime"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Run isolated live tests
        run: npm run test:live

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the app image
        run: docker build -t trimtime-app:ci .

  publish:
    name: Publish linux/arm64 to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, live, image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: 035611741535.dkr.ecr.eu-central-1.amazonaws.com/trimtime-app
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Require AWS_ROLE_ARN
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "Set repository variable AWS_ROLE_ARN to terraform output github_actions_role_arn."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push linux/arm64
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            -t "$ECR_REPOSITORY:$GITHUB_SHA" \
            --push \
            .

  deploy:
    name: Deploy SHA to EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-central-1
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require deploy variables
        run: |
          missing=0
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "Set repository variable AWS_ROLE_ARN."
            missing=1
          fi
          if [ -z "${{ vars.EC2_INSTANCE_ID }}" ]; then
            echo "Set repository variable EC2_INSTANCE_ID to terraform output ec2_instance_id."
            missing=1
          fi
          exit "$missing"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: bash .github/scripts/ssm-deploy.sh "${{ vars.EC2_INSTANCE_ID }}" "$GITHUB_SHA"

      - name: Public health check
        if: vars.SITE_URL != ''
        run: |
          curl -fsS "${{ vars.SITE_URL }}/api/health"
          echo
